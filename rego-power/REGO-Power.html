function draw(){
  const dpr=DPR();
  const sx=shake?(Math.random()-.5)*shake:0, sy=shake?(Math.random()-.5)*shake:0;
  ctx.setTransform(dpr,0,0,dpr,sx,sy);
  ctx.clearRect(-9,-9,(COLS+GUT)*cell+18,ROWS*cell+18);
  if(sky) ctx.drawImage(sky,0,0);
  aurora(); drawSun(); drawClouds(); drawWind(); drawRain();

  for(let c=0;c<COLS;c++){
    const h=demand[c],y=(ROWS-h)*cell,sv=servedC(c);
    ctx.fillStyle=sv?`rgba(0,235,145,${.10+Math.sin(T/12)*.04})`:'rgba(255,255,255,.05)';
    ctx.fillRect(c*cell,y,cell,h*cell);
    if(piece&&running&&!allowedCol(c,piece.src)){
      ctx.fillStyle='rgba(3,7,10,.58)'; ctx.fillRect(c*cell,0,cell,ROWS*cell);
    }
    if(isGolden(c)){
      const done=regos[c], pu=.5+Math.sin(T/9)*.5;
      const g=ctx.createLinearGradient(0,0,0,ROWS*cell);
      g.addColorStop(0,`rgba(255,210,74,${(done?.05:.13)+pu*.06})`);
      g.addColorStop(1,`rgba(255,210,74,${(done?.02:.05)})`);
      ctx.fillStyle=g; ctx.fillRect(c*cell,0,cell,ROWS*cell);
      ctx.strokeStyle=`rgba(255,210,74,${done?.35:.55+pu*.35})`; ctx.lineWidth=1.4;
      ctx.strokeRect(c*cell+.7,.7,cell-1.4,ROWS*cell-1.4);
      if(!done){                                  // a small crown, floating
        const cx=(c+.5)*cell, cy=cell*.95+Math.sin(T/11)*cell*.13, r=cell*.34;
        ctx.fillStyle=REGO_GOLD; ctx.globalAlpha=.55+pu*.45;
        ctx.beginPath();
        ctx.moveTo(cx-r,cy+r*.55); ctx.lineTo(cx-r,cy-r*.55);
        ctx.lineTo(cx-r*.45,cy); ctx.lineTo(cx,cy-r*.75);
        ctx.lineTo(cx+r*.45,cy); ctx.lineTo(cx+r,cy-r*.55);
        ctx.lineTo(cx+r,cy+r*.55); ctx.closePath(); ctx.fill();
        ctx.globalAlpha=1;
      }
    }
    ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(c*cell+.5,0); ctx.lineTo(c*cell+.5,ROWS*cell); ctx.stroke();
  }

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const s=board[r][c]; if(!s) continue;
    if((ROWS-r)>demand[c]){
      ctx.globalAlpha=.20; ctx.fillStyle=SRC[s].c;
      ctx.fillRect(c*cell+1,r*cell+1,cell-2,cell-2); ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.setLineDash([2,2]);
      ctx.strokeRect(c*cell+1.5,r*cell+1.5,cell-3,cell-3); ctx.setLineDash([]);
    } else block(c,r,s,1,false);
  }

  if(piece&&running){
    const gc=SRC[piece.src].c;
    const gy=dropY(piece.m,piece.x,piece.y);
    for(const c of occCols(piece.m,piece.x)){
      const top=(piece.y+piece.m.length)*cell+pvy, bot=(ROWS-stackH(c))*cell;
      if(bot>top){
        const g=ctx.createLinearGradient(0,top,0,bot);
        g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,gc+'33');
        ctx.fillStyle=g; ctx.fillRect(c*cell+1,top,cell-2,bot-top);
        ctx.strokeStyle=gc+'40'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(c*cell+.5,top); ctx.lineTo(c*cell+.5,bot);
        ctx.moveTo((c+1)*cell-.5,top); ctx.lineTo((c+1)*cell-.5,bot); ctx.stroke();
      }
    }
    for(let r=0;r<piece.m.length;r++) for(let c=0;c<piece.m[0].length;c++)
      if(piece.m[r][c] && gy+r>=0) block(piece.x+c,gy+r,piece.src,.30,false);
    ctx.save(); ctx.translate(pvx,pvy+Math.sin(T/7)*.7);
    for(let r=0;r<piece.m.length;r++) for(let c=0;c<piece.m[0].length;c++)
      if(piece.m[r][c] && piece.y+r>=0) block(piece.x+c,piece.y+r,piece.src,1,true);
    ctx.restore();
  }

  if(hintT>0 && piece && running){
    const y=(piece.y+piece.m.length+2.2)*cell, x=(piece.x+piece.m[0].length/2)*cell;
    const a=.35+Math.sin(T/9)*.3;
    ctx.globalAlpha=Math.min(1,hintT)*a+.25;
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.arc(x,y,cell*.52,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,cell*.16,0,7); ctx.fillStyle='#fff'; ctx.fill();
    for(const d0 of [-1,1]){
      const x0=x+d0*cell*.95, x1=x+d0*cell*1.85;
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y);
      ctx.moveTo(x1-d0*cell*.34,y-cell*.30); ctx.lineTo(x1,y);
      ctx.lineTo(x1-d0*cell*.34,y+cell*.30); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  // what is this? — a tag pinned to the falling piece
  if(piece&&running){
    const s0=SRC[piece.src], label=NAMES[piece.src];
    const cx=(piece.x+piece.m[0].length/2)*cell+pvx;
    let ty=piece.y*cell+pvy-cell*.60;
    if(ty<cell*.9) ty=(piece.y+piece.m.length)*cell+pvy+cell*.95;
    ctx.font=`800 ${Math.max(9,cell*.62)}px 'DM Sans',sans-serif`;
    const tw=ctx.measureText(label).width+cell*1.15, th=cell*.92;
    let tx=Math.max(2,Math.min(COLS*cell-tw-2,cx-tw/2));
    ctx.globalAlpha=.94;
    ctx.fillStyle='rgba(6,11,14,.9)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(tx,ty-th/2,tw,th,th/2); else ctx.rect(tx,ty-th/2,tw,th);
    ctx.fill();
    ctx.strokeStyle=s0.c; ctx.lineWidth=1.6;
    ctx.shadowColor=s0.c; ctx.shadowBlur=9; ctx.stroke(); ctx.shadowBlur=0;
    glyphOn(tx+th*.52,ty,th*.26,piece.src,s0.c);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(label,tx+th*.92,ty+1);
    ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.globalAlpha=1;
  }

  for(const f of flash){
    ctx.globalAlpha=f.t*.7; ctx.fillStyle='#00EB91';
    ctx.fillRect(f.c*cell,(ROWS-demand[f.c])*cell,cell,demand[f.c]*cell); ctx.globalAlpha=1;
  }
  // REGO seals sit above every hour certified fossil-free
  for(let c=0;c<COLS;c++){
    if(!regos[c]) continue;
    const y=(ROWS-demand[c]+.5)*cell, x=(c+.5)*cell, r=cell*.31;
    ctx.fillStyle='rgba(255,210,74,.9)';
    ctx.fillRect(c*cell+1,(ROWS-demand[c])*cell-1.5,cell-2,2);
    ctx.save(); ctx.translate(x,y);
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3;
      i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
    ctx.closePath();
    ctx.fillStyle=regos[c]===2?'rgba(80,54,4,.85)':'rgba(20,14,2,.55)'; ctx.fill();
    ctx.strokeStyle=REGO_GOLD; ctx.lineWidth=regos[c]===2?2.4:1.4;
    if(regos[c]===2){ ctx.shadowColor=REGO_GOLD; ctx.shadowBlur=cell*.55; }
    ctx.stroke(); ctx.shadowBlur=0;
    ctx.strokeStyle=REGO_GOLD; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-r*.36,0); ctx.lineTo(-r*.08,r*.30); ctx.lineTo(r*.40,-r*.32);
    ctx.stroke();
    const sh=((T*.9+c*40)%420)/420;
    if(sh<.22){
      ctx.globalAlpha=(1-sh/.22)*.55;
      ctx.strokeStyle='#FFF6D6'; ctx.lineWidth=r*.42;
      ctx.beginPath();
      ctx.moveTo(-r*1.1+sh*4.6*r, -r*1.1); ctx.lineTo(-r*.4+sh*4.6*r, r*1.1);
      ctx.stroke(); ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  for(const f of regoFx){
    const y=(ROWS-demand[f.c]+.5)*cell - (1-f.t)*cell*2.4;
    const r=cell*.30*(1+(1-f.t)*1.5);
    ctx.save(); ctx.globalAlpha=f.t; ctx.translate((f.c+.5)*cell,y);
    ctx.strokeStyle=REGO_GOLD; ctx.lineWidth=2; ctx.shadowColor=REGO_GOLD; ctx.shadowBlur=14;
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3;
      i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
    ctx.closePath(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();
  }
  for(const f of goldFx){                       // expanding gold shockwave
    const cx=(f.c+.5)*cell, cy=(ROWS-demand[f.c]+.5)*cell, k=1-f.t;
    ctx.save(); ctx.globalAlpha=f.t*.9;
    ctx.strokeStyle=REGO_GOLD; ctx.lineWidth=3.2*f.t;
    ctx.shadowColor=REGO_GOLD; ctx.shadowBlur=20*f.t;
    for(const m of [1,1.7,2.5]){
      ctx.beginPath(); ctx.arc(cx,cy,cell*.5+k*cell*4.4*m,0,7); ctx.stroke();
    }
    ctx.globalAlpha=f.t*.55; ctx.lineWidth=1.6;
    for(let i=0;i<12;i++){
      const a=i*Math.PI/6+k*.6, r0=cell*(.7+k*2.4), r1=r0+cell*(.7+k*2.6);
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); ctx.stroke();
    }
    ctx.restore();
  }
  if(finale){                                   // 24 out of 24
    const lit=Math.min(COLS,finale.i);
    for(let c=0;c<lit;c++){
      const g=ctx.createLinearGradient(0,ROWS*cell,0,0);
      g.addColorStop(0,'rgba(255,210,74,.55)');
      g.addColorStop(1,'rgba(255,210,74,0)');
      ctx.fillStyle=g; ctx.fillRect(c*cell,0,cell,ROWS*cell);
    }
    if(finale.all){
      ctx.globalAlpha=Math.max(0,finale.all);
      ctx.fillStyle='rgba(255,244,208,.5)';
      ctx.fillRect(0,0,COLS*cell,ROWS*cell);
      ctx.globalAlpha=1;
    }
  }
  for(const rg of rings){
    ctx.globalAlpha=rg.t*.8; ctx.strokeStyle='#00EB91'; ctx.lineWidth=2.5;
    const y=(ROWS-demand[rg.c])*cell, w=cell+(1-rg.t)*cell*2.4;
    ctx.strokeRect((rg.c+.5)*cell-w/2, y-(1-rg.t)*cell*1.2, w, demand[rg.c]*cell+(1-rg.t)*cell*1.2);
    ctx.globalAlpha=1;
  }

  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=7;
  ctx.beginPath();
  for(let c=0;c<COLS;c++){
    const y=(ROWS-demand[c])*cell;
    if(c===0) ctx.moveTo(0,y);
    else { ctx.lineTo(c*cell,(ROWS-demand[c-1])*cell); ctx.lineTo(c*cell,y); }
    ctx.lineTo((c+1)*cell,y);
  }
  ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.shadowColor='rgba(255,255,255,.55)'; ctx.shadowBlur=6;
  ctx.setLineDash([7,4]); ctx.lineDashOffset=-T*.7*tempo;
  ctx.beginPath();
  for(let c=0;c<COLS;c++){
    const y=(ROWS-demand[c])*cell;
    if(c===0) ctx.moveTo(0,y);
    else { ctx.lineTo(c*cell,(ROWS-demand[c-1])*cell); ctx.lineTo(c*cell,y); }
    ctx.lineTo((c+1)*cell,y);
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0; ctx.shadowBlur=0;

  for(const p of parts){
    ctx.globalAlpha=p.life; ctx.fillStyle=p.colour;
    const sz=p.fly?3.4:2.8;
    ctx.shadowColor=p.colour; ctx.shadowBlur=p.fly?8:0;
    ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1; ctx.textAlign='center';
  for(const p of pops){
    ctx.globalAlpha=Math.min(1,p.life*1.4); ctx.fillStyle=p.colour;
    ctx.font=`900 ${Math.max(10,cell*.9)}px 'DM Sans',sans-serif`;
    ctx.shadowColor=p.colour; ctx.shadowBlur=8;
    ctx.fillText(p.text,p.x,p.y-(1-p.life)*30); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  // PATtech watermark
  ctx.globalAlpha=.09; ctx.textAlign='right';
  ctx.font=`800 ${Math.max(8,cell*.62)}px 'DM Sans',sans-serif`;
  ctx.fillStyle='#fff'; ctx.fillText('PATtech', COLS*cell-cell*.35, ROWS*cell-cell*.35);
  ctx.beginPath();
  const wy=ROWS*cell-cell*.62, wx=COLS*cell-cell*.35-ctx.measureText('PATtech').width-cell*.42;
  ctx.moveTo(wx,wy-cell*.20); ctx.lineTo(wx+cell*.32,wy); ctx.lineTo(wx,wy+cell*.20);
  ctx.closePath(); ctx.fillStyle='#00B872'; ctx.globalAlpha=.22; ctx.fill();
  ctx.globalAlpha=1; ctx.textAlign='center';
  if(bolt>0){
    ctx.globalAlpha=Math.min(.55,bolt*.55); ctx.fillStyle='#DCEEFF';
    ctx.fillRect(0,0,COLS*cell,ROWS*cell); ctx.globalAlpha=1;
  }
  bloom();
  drawTips(); drawCoach();
  drawGauges(); scanlines();
}

/* ================= first-run tutorial =================
   one action at a time, gated, with everything else dimmed.
   step 0 goal · 1 drag · 2 drop · 3 turn · 4 free            */
const TUT_STEPS=[
  {key:'goal', word:'FILL TO THE LINE'},
  {key:'drag', word:'DRAG'},
  {key:'drop', word:'DROP'},
  {key:'seal', word:'REGO'},
  {key:'turn', word:'TURN'},
  {key:'free', word:''}
];
function startTut(){ tut={on:true,step:0,target:12,t:0,sealReady:false};
  tipsDone={}; tipQueue=[]; tips=[]; tipCool=0; }
function tutKey(){ return tut&&tut.on ? TUT_STEPS[tut.step].key : 'free'; }
function tutGate(){
  const k=tutKey();
  if(k==='free') return false;
  if(k==='seal') return !!tut.sealReady;
  return true;
}
function endTut(){
  if(!tut) return;
  tut.on=false; seenTut=true; saveBest(); toast('GO!','#57FFBF'); S.award();
}
function tutTarget(){
  if(!piece) return 12;
  let bestC=-1,bestGap=-1;
  const w=piece.m[0].length;
  for(let x=0;x<=COLS-w;x++){
    if(!legalAt(piece.m,x,piece.src)) continue;
    let gap=0; for(const c of occCols(piece.m,x)) gap+=demand[c]-stackH(c);
    if(gap>bestGap){ bestGap=gap; bestC=x; }
  }
  return bestC<0?piece.x:bestC;
}
function tutAdvance(k){
  if(!tut||!tut.on) return;
  if(TUT_STEPS[tut.step].key!==k) return;
  tut.step++; tut.t=0; tut.sealReady=false; S.served(); buzz(14);
  if(tutKey()==='drag') tut.target=tutTarget();
  if(tutKey()==='free') endTut();
}
let tips=[], tipQueue=[], tipsDone={}, tipCool=0;
function showTip(id,ring,icon,words,life){
  if(tipsDone[id]||day!==1) return;
  tipsDone[id]=1;
  tipQueue.push({ring,icon,words,t:1,life:life||4600});
}
function pumpTips(dt){
  if(tipCool>0) tipCool-=dt;
  if(tips.length||!tipQueue.length||tutGate()||!running||tipCool>0) return;
  tips.push(tipQueue.shift()); tipCool=900; S.charge();
}
function tipTriggers(){
  if(!piece||day!==1) return;
  if(piece.src==='solar')
    showTip('sun',{x:DAWN*cell,y:0,w:(DUSK-DAWN+1)*cell,h:ROWS*cell},'solar','DAYLIGHT ONLY');
  if(piece.src==='wind'){
    let a=-1,b=-1;
    for(let c=0;c<COLS;c++){ if(wind[c]<.22){ if(a<0)a=c; b=c; } else if(a>=0) break; }
    if(a>=0) showTip('wind',{x:a*cell,y:0,w:(b-a+1)*cell,h:ROWS*cell},'wind','NO WIND HERE');
  }
  if(piece.src==='hydro'){
    const x0=COLS*cell+cell*.4;
    showTip('lake',{x:x0,y:cell*1.1,w:cell*1.55,h:ROWS*cell-cell*2.3},'hydro','THE LAKE');
  }
}
function drawTips(){
  for(const tp of tips){
    const a=Math.min(1,tp.t*2.2), pulse=.5+.5*Math.sin(T/8);
    ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(255,210,74,${.55+pulse*.45})`; ctx.lineWidth=2.5;
    ctx.setLineDash([7,5]); ctx.lineDashOffset=-T*.5;
    ctx.strokeRect(tp.ring.x+1,tp.ring.y+1,tp.ring.w-2,tp.ring.h-2);
    ctx.setLineDash([]);
    const cx=Math.max(cell*4.2,Math.min(COLS*cell-cell*4.2,tp.ring.x+tp.ring.w/2));
    const cy=ROWS*cell*.30;
    ctx.font=`800 ${Math.max(9,cell*.66)}px 'DM Sans',sans-serif`;
    const w=ctx.measureText(tp.words).width+cell*2.0, h=cell*1.25;
    ctx.fillStyle='rgba(6,11,14,.94)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx-w/2,cy-h/2,w,h,h/2); else ctx.rect(cx-w/2,cy-h/2,w,h);
    ctx.fill();
    ctx.strokeStyle='#FFD24A'; ctx.lineWidth=1.8; ctx.stroke();
    glyphOn(cx-w/2+h*.60,cy,h*.28,tp.icon,SRC[tp.icon].c);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(tp.words,cx-w/2+h*1.05,cy+1);
    ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.globalAlpha=1;
  }
}
function drawCoach(){
  if(!tut||!tut.on) return;
  const st=TUT_STEPS[tut.step], pulse=.5+.5*Math.sin(T/11);
  ctx.fillStyle='rgba(4,8,11,.55)';
  ctx.fillRect(0,0,COLS*cell,ROWS*cell);
  ctx.strokeStyle=`rgba(255,255,255,${.45+pulse*.35})`; ctx.lineWidth=2.5;
  ctx.setLineDash([7,4]);
  ctx.beginPath();
  for(let c=0;c<COLS;c++){
    const y=(ROWS-demand[c])*cell;
    if(c===0) ctx.moveTo(0,y);
    else { ctx.lineTo(c*cell,(ROWS-demand[c-1])*cell); ctx.lineTo(c*cell,y); }
    ctx.lineTo((c+1)*cell,y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  if(st.key==='seal'&&tut.sealReady){
    const cx=COLS*cell/2, cy=ROWS*cell*.50, r=cell*2.4*(1+.06*Math.sin(T/9));
    ctx.save(); ctx.translate(cx,cy);
    ctx.shadowColor='#FFD24A'; ctx.shadowBlur=26;
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3;
      i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
    ctx.closePath();
    ctx.fillStyle='rgba(26,18,3,.96)'; ctx.fill();
    ctx.strokeStyle='#FFD24A'; ctx.lineWidth=3.5; ctx.stroke(); ctx.shadowBlur=0;
    ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-r*.34,0); ctx.lineTo(-r*.05,r*.30); ctx.lineTo(r*.38,-r*.30);
    ctx.stroke(); ctx.restore();
    ctx.fillStyle='#FFD24A';
    ctx.font=`500 ${Math.max(8,cell*.55)}px 'DM Mono',monospace`;
    ctx.fillText('ONE CLEAN HOUR', cx, cy+r+cell*1.1);
  }

  if(st.key==='goal'){
    for(let c=2;c<COLS;c+=5){
      const y0=ROWS*cell-cell*.4, y1=(ROWS-demand[c])*cell+cell*.4;
      const off=pulse*cell*.5;
      ctx.strokeStyle='rgba(0,235,145,.95)'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo((c+.5)*cell,y0-off); ctx.lineTo((c+.5)*cell,y1-off);
      ctx.moveTo((c+.5)*cell-cell*.35,y1-off+cell*.45);
      ctx.lineTo((c+.5)*cell,y1-off);
      ctx.lineTo((c+.5)*cell+cell*.35,y1-off+cell*.45);
      ctx.stroke();
    }
  }

  if(st.key==='drag'&&piece){                           // glow the hour to aim at
    const w=piece.m[0].length;
    ctx.fillStyle=`rgba(255,210,74,${.14+pulse*.14})`;
    ctx.fillRect(tut.target*cell,0,w*cell,ROWS*cell);
    ctx.strokeStyle='#FFD24A'; ctx.lineWidth=2.5; ctx.setLineDash([6,5]);
    ctx.strokeRect(tut.target*cell+1,1,w*cell-2,ROWS*cell-2); ctx.setLineDash([]);
  }

  if(piece){                                            // the piece stays lit
    ctx.save(); ctx.translate(pvx,pvy);
    for(let r=0;r<piece.m.length;r++) for(let c=0;c<piece.m[0].length;c++)
      if(piece.m[r][c]&&piece.y+r>=0) block(piece.x+c,piece.y+r,piece.src,1,true);
    ctx.restore();
  }

  // the hand
  const hx=(piece?(piece.x+piece.m[0].length/2):12)*cell+pvx;
  const hy=(piece?(piece.y+piece.m.length):3)*cell+pvy+cell*2.1;
  ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round';
  if(st.key==='drag'){
    const dir=(tut.target>=piece.x)?1:-1;
    const swing=hx+dir*pulse*cell*2.6;
    ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.arc(swing,hy,cell*.55,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(swing,hy,cell*.18,0,7); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(swing+dir*cell*1.0,hy); ctx.lineTo(swing+dir*cell*2.0,hy);
    ctx.moveTo(swing+dir*cell*1.66,hy-cell*.32);
    ctx.lineTo(swing+dir*cell*2.0,hy); ctx.lineTo(swing+dir*cell*1.66,hy+cell*.32);
    ctx.stroke(); ctx.globalAlpha=1;
  } else if(st.key==='drop'){
    const yy=hy+pulse*cell*1.1;
    ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.arc(hx,yy,cell*.55,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx,yy,cell*.18,0,7); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hx,yy+cell*1.0); ctx.lineTo(hx,yy+cell*2.0);
    ctx.moveTo(hx-cell*.32,yy+cell*1.66);
    ctx.lineTo(hx,yy+cell*2.0); ctx.lineTo(hx+cell*.32,yy+cell*1.66);
    ctx.stroke(); ctx.globalAlpha=1;
  } else if(st.key==='turn'){
    ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.arc(hx,hy,cell*1.15,-2.2,1.5); ctx.stroke();
    const a=1.5, ex=hx+Math.cos(a)*cell*1.15, ey=hy+Math.sin(a)*cell*1.15;
    ctx.beginPath();
    ctx.moveTo(ex-cell*.42,ey-cell*.10); ctx.lineTo(ex,ey+cell*.30);
    ctx.lineTo(ex+cell*.28,ey-cell*.28); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx,hy,cell*.18,0,7); ctx.fillStyle='#fff'; ctx.fill();
    ctx.globalAlpha=1;
  } else if(st.key==='goal'){
    ctx.globalAlpha=.55+pulse*.4;
    ctx.beginPath(); ctx.arc(COLS*cell/2,ROWS*cell*.62,cell*.5,0,7);
    ctx.fillStyle='#fff'; ctx.fill(); ctx.globalAlpha=1;
  }

  // the word
  ctx.textAlign='center';
  ctx.font=`900 ${Math.max(15,cell*1.35)}px 'DM Sans',sans-serif`;
  ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=10;
  ctx.fillText(st.word, COLS*cell/2, cell*2.2);
  ctx.shadowBlur=0;
  ctx.font=`500 ${Math.max(8,cell*.55)}px 'DM Mono',monospace`;
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText((st.key==='goal'||(st.key==='seal'&&tut.sealReady))?'TAP':'',
               COLS*cell/2, cell*3.3);

  // how far through
  const dots=5;
  for(let i=0;i<dots;i++){
    const dx=COLS*cell/2+(i-(dots-1)/2)*cell*.9, dy=ROWS*cell-cell*.85;
    ctx.beginPath(); ctx.arc(dx,dy,cell*.16,0,7);
    ctx.fillStyle = i<tut.step ? '#00EB91' : (i===tut.step?'#fff':'rgba(255,255,255,.22)');
    ctx.fill();
  }
  // a way out for grown-ups
  TUT_SKIP={x:COLS*cell-cell*3.1,y:cell*.35,w:cell*2.8,h:cell*1.15};
  ctx.fillStyle='rgba(255,255,255,.10)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(TUT_SKIP.x,TUT_SKIP.y,TUT_SKIP.w,TUT_SKIP.h,TUT_SKIP.h/2);
  else ctx.rect(TUT_SKIP.x,TUT_SKIP.y,TUT_SKIP.w,TUT_SKIP.h);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.72)';
  ctx.font=`500 ${Math.max(7,cell*.5)}px 'DM Mono',monospace`;
  ctx.fillText('SKIP', TUT_SKIP.x+TUT_SKIP.w/2, TUT_SKIP.y+TUT_SKIP.h*.68);
}

    if(v && ROWS-r<=demand[c]) tally[v]=(tally[v]||0)+1;

  for(const k in tally) if(tally[k]>n){ n=tally[k]; top=k; }

    k, pct:Math.round((dayU[k]||0)/total*100), hrs:hours[k]||0

/* progress storage: the artifact host's API when present, localStorage on a normal
   web host, and nothing at all if both are blocked (private mode). Never throws. */
const SAVE_KEY='regopower:save';
const STORE={
  async set(k,v){
    try{ if(window.storage&&window.storage.set) { await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  },
  async get(k){
    try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k);
      if(r&&r.value!=null) return r.value; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  }
};
async function saveBest(){
  if(score>best) best=score;
  bestDay=Math.max(bestDay,day);
  await STORE.set(SAVE_KEY, JSON.stringify(
    {best, lifetimeRego, bestDay, badges, seenTut, streakDays, lastPlayed, daysPowered,
     vault, vaultHours, goldTotal, chainBest, unlockSeen}));
}
async function loadBest(){
  try{
    const raw=await STORE.get(SAVE_KEY);
    if(!raw) return;
    const v=JSON.parse(raw);
    best=v.best||0; lifetimeRego=v.lifetimeRego||0; seenTut=!!v.seenTut;
    streakDays=v.streakDays||0; lastPlayed=v.lastPlayed||''; daysPowered=v.daysPowered||0;
    bestDay=v.bestDay||0; badges=Array.isArray(v.badges)?v.badges:[];
    vault=Array.isArray(v.vault)?v.vault:[];
    vaultHours=Array.isArray(v.vaultHours)?v.vaultHours:[];
    goldTotal=v.goldTotal||0; chainBest=v.chainBest||0;
    unlockSeen=Array.isArray(v.unlockSeen)?v.unlockSeen:[];
    /* anyone who played before milestones existed keeps what they already earned,
       without a wall of unlock cards on their next summary */
    for(const u of UNLOCKS) if(lifetimeRego>=u.n && unlockSeen.indexOf(u.id)<0) unlockSeen.push(u.id);
  }catch(e){}
}

/* ---------- animated how-to-play ---------- */
const HOWTO=[
  {cap:'FILL EVERY HOUR TO THE LINE'},
  {cap:'SUN: DAYTIME ONLY'},
  {cap:'WIND: ONLY WHERE IT BLOWS'},
  {cap:'HYDRO: THE LAKE RUNS DOWN'},
  {cap:'SPARE POWER GOES TO THE BATTERY'},
  {cap:'GAS FILLS THE GAP — BUT NO SEAL'},
  {cap:'EVERY CLEAN HOUR EARNS A REGO'}
];
let hoOn=false, hoScene=0, hoT=0;

function hoBlock(g,x,y,S,src,alpha){
  const sc=SRC[src], p=Math.max(1,S*.08), w=S-2*p;
  g.globalAlpha=alpha===undefined?1:alpha;
  const lg=g.createLinearGradient(0,y+p,0,y+p+w);
  lg.addColorStop(0,sc.c2); lg.addColorStop(.34,sc.c); lg.addColorStop(1,sc.c);
  g.fillStyle=lg;
  g.beginPath();
  if(g.roundRect) g.roundRect(x+p,y+p,w,w,Math.max(2,S*.2)); else g.rect(x+p,y+p,w,w);
  g.fill();
  g.save(); g.translate(x+p+w/2,y+p+w*.57);
  g.fillStyle='rgba(8,14,18,.6)'; g.strokeStyle='rgba(8,14,18,.6)';
  glyphPathOn(g,w*.27,src); g.restore();
  g.globalAlpha=1;
}
function hoSeal(g,cx,cy,r,alpha){
  g.globalAlpha=alpha===undefined?1:alpha;
  g.beginPath();
  for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3;
    i?g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); }
  g.closePath();
  g.fillStyle='rgba(26,18,3,.95)'; g.fill();
  g.strokeStyle='#FFD24A'; g.lineWidth=Math.max(1.5,r*.14); g.stroke();
  g.lineCap='round';
  g.beginPath(); g.moveTo(cx-r*.34,cy); g.lineTo(cx-r*.05,cy+r*.30); g.lineTo(cx+r*.38,cy-r*.30);
  g.stroke(); g.globalAlpha=1;
}
function hoLine(g,x0,base,S,hs,colour){
  g.strokeStyle=colour||'#fff'; g.lineWidth=2.5; g.setLineDash([7,5]);
  g.beginPath();
  hs.forEach((h,i)=>{ const y=base-h*S;
    if(i===0) g.moveTo(x0,y); else { g.lineTo(x0+i*S,base-hs[i-1]*S); g.lineTo(x0+i*S,y); }
    g.lineTo(x0+(i+1)*S,y); });
  g.stroke(); g.setLineDash([]);
}
function hoCross(g,cx,cy,r){
  g.strokeStyle='#FF6B6B'; g.lineWidth=Math.max(2.5,r*.34); g.lineCap='round';
  g.beginPath(); g.moveTo(cx-r,cy-r); g.lineTo(cx+r,cy+r);
  g.moveTo(cx+r,cy-r); g.lineTo(cx-r,cy+r); g.stroke();
}
function hoTank(g,x,y,w,h,frac,top,bot,label){
  g.fillStyle='#081116'; g.strokeStyle='#22323A'; g.lineWidth=2;
  g.beginPath();
  if(g.roundRect) g.roundRect(x,y,w,h,6); else g.rect(x,y,w,h);
  g.fill(); g.stroke();
  const lv=h*Math.max(0,Math.min(1,frac));
  const lg=g.createLinearGradient(0,y+h-lv,0,y+h);
  lg.addColorStop(0,top); lg.addColorStop(1,bot);
  g.fillStyle=lg; g.fillRect(x+2,y+h-lv+2,w-4,lv-4);
}

function drawHowto(g,W2,H2,p){
  g.clearRect(0,0,W2,H2);
  g.fillStyle='#070F14'; g.fillRect(0,0,W2,H2);
  const S=46, n=9, x0=(W2-n*S)/2, base=H2-46;
  const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);

  if(hoScene===0){
    const want=[2,3,4,3,2,3,4,3,2], cols=['solar','wind','hydro','geo'];
    for(let i=0;i<n;i++){
      const st=i*0.07, pr=ease((p-st)/0.30);
      const k=Math.floor(pr*want[i]+0.001);
      for(let j=0;j<k;j++) hoBlock(g,x0+i*S,base-(j+1)*S,S,cols[(i+j)%4]);
    }
    hoLine(g,x0,base,S,want);
    if(p>0.72){
      g.globalAlpha=(p-0.72)/0.28*0.35;
      g.fillStyle='#00EB91'; g.fillRect(x0,base-4*S,n*S,4*S); g.globalAlpha=1;
    }
  }

  if(hoScene===1){
    g.fillStyle='#0A141A'; g.fillRect(x0,base-4.4*S,n*S,4.4*S);
    const grad=g.createLinearGradient(x0+3*S,0,x0+6*S,0);
    grad.addColorStop(0,'rgba(255,197,61,.10)');
    grad.addColorStop(.5,'rgba(255,197,61,.30)');
    grad.addColorStop(1,'rgba(255,197,61,.10)');
    g.fillStyle=grad; g.fillRect(x0+3*S,base-4.4*S,3*S,4.4*S);
    g.fillStyle='#FFE3A0'; g.beginPath(); g.arc(x0+4.5*S,base-3.8*S,S*.44,0,7); g.fill();
    g.fillStyle='rgba(190,210,224,.45)';
    g.beginPath(); g.arc(x0+1*S,base-3.8*S,S*.26,0,7); g.fill();
    g.beginPath(); g.arc(x0+7.6*S,base-3.8*S,S*.26,0,7); g.fill();
    const t=ease((p-0.42)/0.30);
    const bx = x0 + (1 + 3.2*Math.max(0,t))*S;
    hoBlock(g,bx,base-1.7*S,S,'solar');
    if(p<0.42) hoCross(g,bx+S/2,base-1.2*S,S*.44);
    else if(t>=1) hoSeal(g,x0+4.5*S+S*1.1,base-1.2*S,S*.32);
  }
  if(hoScene===2){
    for(let i=0;i<n;i++){
      const windy=i>=4;
      g.strokeStyle=windy?'rgba(125,249,208,.85)':'rgba(125,249,208,.18)';
      g.lineWidth=2.5;
      g.beginPath();
      for(let k=0;k<3;k++){
        const y=base-3.6*S+k*S*.55;
        const off=windy?((hoT*.09+i*13+k*20)%(S*1.6))-S*.5:0;
        g.moveTo(x0+i*S+off, y); g.lineTo(x0+i*S+off+(windy?S*.7:S*.3), y);
      }
      g.stroke();
    }
    const x = p<0.5 ? x0+1*S : x0+5*S;
    hoBlock(g,x,base-1.6*S,S,'wind');
    if(p<0.5) hoCross(g,x+S/2,base-1.1*S,S*.42);
  }

  if(hoScene===3){
    const drain=Math.min(1,p*2), refill=Math.max(0,(p-0.6)/0.4);
    hoTank(g,x0+0.4*S,base-4.2*S,S*.9,4.0*S, 0.92-0.75*drain+0.75*refill,'#7ACDFF','#154D7C');
    for(let i=0;i<3;i++){
      const shown=drain>(i+1)/3.5;
      if(shown) hoBlock(g,x0+(2.2+i*1.1)*S,base-1.6*S,S,'hydro');
    }
    if(p>0.55){
      const a=Math.min(1,(p-0.55)/0.2);
      g.globalAlpha=a*.8;
      g.fillStyle='rgba(210,228,240,.9)';
      g.beginPath(); g.ellipse(x0+6.6*S,base-3.6*S,S*1.0,S*.42,0,0,7); g.fill();
      g.strokeStyle='#3BA7FF'; g.lineWidth=2.5; g.lineCap='round';
      g.beginPath();
      for(let k=0;k<4;k++){
        const rx=x0+(6.0+k*.42)*S, ry=base-3.1*S+((hoT*.16+k*22)%(S*1.4));
        g.moveTo(rx,ry); g.lineTo(rx-4,ry+S*.36);
      }
      g.stroke(); g.globalAlpha=1;
    }
  }

  if(hoScene===4){
    const want=[3,3,3,3,3,3,3,3,3];
    hoLine(g,x0,base,S,want);
    for(let i=0;i<4;i++) for(let j=0;j<3;j++) hoBlock(g,x0+i*S,base-(j+1)*S,S,'solar');
    hoTank(g,x0+8.1*S,base-4.2*S,S*.8,4.0*S, p<0.5?0.15:0.15+0.5*ease((p-0.5)/0.3),'#DDA8FF','#6B2CA8');
    if(p<0.55){
      const t=ease(p/0.5);
      const sx=x0+2*S+(x0+8.1*S-(x0+2*S))*t, sy=base-4.2*S+ (base-4.6*S-(base-4.2*S))*0;
      hoBlock(g,sx,base-4.3*S+t*0.4*S,S*.8,'solar',1-t*0.3);
    } else {
      const t=ease((p-0.55)/0.45);
      hoBlock(g,x0+8.1*S-(x0+8.1*S-(x0+5*S))*t, base-1.6*S, S*.8,'batt');
    }
  }

  if(hoScene===5){
    const want=[3,3,3,3,3,3,3,3,3];
    hoLine(g,x0,base,S,want);
    const gasCol=4, fill=ease(p/0.45);
    for(let i=0;i<n;i++){
      const isGas=(i===gasCol);
      const k=isGas?Math.floor(fill*3+0.001):3;
      for(let j=0;j<k;j++)
        hoBlock(g,x0+i*S,base-(j+1)*S,S,isGas?'gas':'wind');
    }
    if(p>0.5){
      const a2=Math.min(1,(p-0.5)/0.22);
      for(let i=0;i<n;i++){
        if(i===gasCol) continue;
        g.fillStyle=`rgba(255,210,74,${a2})`; g.fillRect(x0+i*S+2,base-3*S-4,S-4,3);
        hoSeal(g,x0+i*S+S/2,base-3.7*S,S*.26,a2);
      }
      hoSeal(g,x0+gasCol*S+S/2,base-3.7*S,S*.26,a2*.30);
      hoCross(g,x0+gasCol*S+S/2,base-3.7*S,S*.30);
    }
  }
  if(hoScene===6){
    const want=[3,3,3,3,3,3,3,3,3];
    hoLine(g,x0,base,S,want);
    const filled=Math.floor(ease(p/0.55)*n+0.001);
    for(let i=0;i<n;i++){
      const done=i<filled;
      for(let j=0;j<3;j++)
        hoBlock(g,x0+i*S,base-(j+1)*S,S,['solar','wind','hydro','geo'][(i+j)%4],done?1:.18);
      if(done){
        g.fillStyle='#FFD24A'; g.fillRect(x0+i*S+2,base-3*S-4,S-4,3);
        const pop=Math.min(1,(ease(p/0.55)*n-i));
        hoSeal(g,x0+i*S+S/2,base-3.6*S,S*.30*(0.6+0.4*pop),pop);
      }
    }
  }

  // caption
  g.textAlign='center';
  g.font=`900 ${W2*0.042}px 'DM Sans',sans-serif`;
  g.fillStyle='#fff';
  g.fillText(HOWTO[hoScene].cap, W2/2, 34);
}

function runHowto(){
  const c=document.getElementById('howto'); if(!c) return;
  const g=c.getContext('2d');
  hoOn=true; hoScene=0; hoT=0;
  const dots=document.getElementById('hdots');
  const paint=()=>{ if(dots) dots.innerHTML=HOWTO.map((_,i)=>
      `<i class="${i===hoScene?'on':''}"></i>`).join(''); };
  paint();
  let last=performance.now();
  (function frame(t){
    if(!hoOn||!document.getElementById('howto')) return;
    const dt=t-last; last=t; hoT+=dt;
    const dur=3600;
    if(hoT>dur){ hoT=0; hoScene=(hoScene+1)%HOWTO.length; paint(); }
    drawHowto(g,c.width,c.height,hoT/dur);
    requestAnimationFrame(frame);
  })(performance.now());
  c.onclick=()=>{ hoT=0; hoScene=(hoScene+1)%HOWTO.length; paint(); };
}

function runDemo(){

  const want=[3,4,5,4,2,3,5,3];
  const cols=['#FFC53D','#7DF9D0','#3BA7FF','#FF7A4D'];
  let have, drop, done, t0;
  const reset=()=>{ have=[3,4,5,0,2,0,5,3]; drop=null; done=0; };
  reset(); demoOn=true;
  (function frame(t){
    if(!demoOn) return;
    d.clearRect(0,0,600,230);
    // demand line
    d.strokeStyle='#fff'; d.lineWidth=2.5; d.setLineDash([9,6]);
    d.lineDashOffset=-(t/22);
    d.beginPath();
    for(let c=0;c<N;c++){
      const y=230-want[c]*CH;
      if(c===0) d.moveTo(0,y); else { d.lineTo(c*CW,230-want[c-1]*CH); d.lineTo(c*CW,y); }
      d.lineTo((c+1)*CW,y);
    }
    d.stroke(); d.setLineDash([]);
    // stacks
    for(let c=0;c<N;c++){
      const full=have[c]>=want[c];
      for(let k=0;k<have[c];k++){
        const x=c*CW+3, y=230-(k+1)*CH+3, w=CW-6, h=CH-6;
        const col = done>0&&full ? '#00EB91' : cols[(c+k)%4];
        d.fillStyle=col;
        d.beginPath();
        if(d.roundRect) d.roundRect(x,y,w,h,6); else d.rect(x,y,w,h);
        d.shadowColor=col; d.shadowBlur=done>0&&full?16:6; d.fill(); d.shadowBlur=0;
      }
    }
    // one block falling into the next gap
    if(!drop && !done){
      const gap=have.findIndex((v,i)=>v<want[i]);
      if(gap>=0) drop={c:gap,y:-CH,col:cols[gap%4]};
      else { done=1; t0=t; }
    }
    if(drop){
      const target=230-(have[drop.c]+1)*CH;
      drop.y+=7.5;
      if(drop.y>=target){
        have[drop.c]++; drop=null;
      } else {
        d.fillStyle=drop.col;
        d.beginPath();
        const x=drop.c*CW+3,w=CW-6,h=CH-6;
        if(d.roundRect) d.roundRect(x,drop.y,w,h,6); else d.rect(x,drop.y,w,h);
        d.shadowColor=drop.col; d.shadowBlur=18; d.fill(); d.shadowBlur=0;
        // guide arrow
        d.strokeStyle='rgba(255,255,255,.35)'; d.lineWidth=2;
        d.beginPath(); d.moveTo(x+w/2,drop.y+h+8); d.lineTo(x+w/2,target-4); d.stroke();
      }
    }
    if(done){
      const k=Math.min(1,(t-t0)/420);
      d.globalAlpha=Math.min(1,k*1.6)*(1-Math.max(0,(t-t0-1100)/700));
      d.strokeStyle='#00EB91'; d.lineWidth=13; d.lineCap='round';
      d.beginPath(); d.moveTo(250,120); d.lineTo(288,160); d.lineTo(360,72); d.stroke();
      d.globalAlpha=1;
      if(t-t0>1800) reset();
    }
    requestAnimationFrame(frame);
  })(performance.now());
}

/* ========== loop ========== */
function pause(on){
  if(!running) return;
  paused=on===undefined?!paused:on;
  document.getElementById('bPause').textContent=paused?'▶':'⏸';
  if(paused) card(`<div class="dayn">PAUSED</div>
    <div class="pausedots">⏸</div><button id="ovBtn">▶</button>`);
  else document.getElementById('ov').classList.add('hide');
  if(paused) document.getElementById('ovBtn').onclick=()=>pause(false);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(true); });

function loop(t){
  const dt=last?Math.min(50,t-last):16; last=t;
  if(paused){ draw(); requestAnimationFrame(loop); return; }
  T+=dt/16;
  const p=running?progress():0;
  tempo = 1 + (level-1)*.28 + p*1.4;              // weather keeps pace with the game

  for(const cl of clouds) cl.x=(cl.x+cl.v*(dt/16)*3*tempo)%COLS;
  for(let c=0;c<COLS;c++)
    wind[c]=Math.max(0,Math.min(1,wind[c]+Math.sin((T*tempo+windPhase[c])/40)*.006*tempo));
  if(running && rain>.45 && windMax()>.72 && Math.random()<.012) bolt=1;
  if(bolt>0) bolt-=dt/240;
  if(running){
    rainTimer-=dt*tempo;
    if(rainTimer<=0&&rain<=0){ rain=1; rainTimer=2400; }
    if(rain>0){ rain-=dt*tempo/2600; lake=Math.min(100,lake+dt*tempo/2600*26); if(rain<0)rain=0; }
  }
  if(running&&piece){
    const rush=p>=.7;
    document.getElementById('boardWrap').classList.toggle('rush',rush);
    if(!tutGate()){
      dropTimer+=dt;
      if(dropTimer>dropBase*(1-.62*p)){ dropTimer=0; stepDown(); }
    }
  }
  for(const q of parts){
    if(q.fly){ q.x+=(q.tx-q.x)*.14; q.y+=(q.ty-q.y)*.14; q.life-=.028; }
    else { q.x+=q.vx; q.y+=q.vy; q.vy+=q.g; q.life-=.035; }
  }
  parts=parts.filter(q=>q.life>0);
  for(const q of pops) q.life-=.022; pops=pops.filter(q=>q.life>0);
  for(const f of flash) f.t-=.05; flash=flash.filter(f=>f.t>0);
  for(const r of rings) r.t-=.045; rings=rings.filter(r=>r.t>0);
  for(const f of regoFx) f.t-=.028; regoFx=regoFx.filter(f=>f.t>0);
  for(const f of goldFx) f.t-=.017; goldFx=goldFx.filter(f=>f.t>0);
  if(finale&&finale.all) finale.all=Math.max(0,finale.all-dt/900);
  if(shake>0){ shake*=.82; if(shake<.3) shake=0; }
  if(hintT>0) hintT-=dt/5200;
  if(tut&&tut.on) tut.t+=dt;
  for(const tp of tips) tp.t-=dt/tp.life;
  tips=tips.filter(tp=>tp.t>0);
  pumpTips(dt);
  if(battGlow>0) battGlow-=dt/600;
  pvx*=.62; if(Math.abs(pvx)<.4) pvx=0;
  pvy*=.55; if(Math.abs(pvy)<.4) pvy=0;
  if(running) updateStrip();
  draw();
  requestAnimationFrame(loop);
}

/* ========== input ========== */
holdable(document.getElementById('bL'),()=>move(-1));
holdable(document.getElementById('bR'),()=>move(1));
document.getElementById('bF').onclick=rotate;
document.getElementById('bD').onclick=hardDrop;
document.getElementById('bBat').onclick=useBattery;
document.getElementById('bGas').onclick=runGas;
document.getElementById('bPause').onclick=()=>pause();
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  if(k==='ArrowLeft') move(-1); else if(k==='ArrowRight') move(1);
  else if(k==='ArrowUp') rotate();
  else if(k==='ArrowDown'){ if(running&&piece) stepDown(); }
  else if(k===' ') hardDrop();
  else if(k.toLowerCase()==='b') useBattery();
  else if(k.toLowerCase()==='g') runGas();
  else if(k.toLowerCase()==='p'||k==='Escape') pause();
});
/* ---- touch: drag the piece with your finger, tap a column to send it there ---- */
function cellCSS(){ return cv.clientWidth/(COLS+GUT); }
let lastMoveSound=0;
function moveTo(target){
  if(!running||!piece||!isFinite(target)) return;
  const w=piece.m[0].length;
  target=Math.max(0,Math.min(COLS-w,target));
  let guard=0;
  while(piece.x!==target && guard++<COLS){
    const d=target>piece.x?1:-1, x=piece.x+d;
    if(!legalAt(piece.m,x,piece.src)||!fits(piece.m,x,piece.y)) break;
    piece.x=x; pvx-=d*cell;
  }
  if(tut&&tut.on&&TUT_STEPS[tut.step].key==='drag'&&piece.x===tut.target) tutAdvance('drag');
  hintT=0;
  const now=performance.now();
  if(now-lastMoveSound>70){ S.move(); buzz(6); lastMoveSound=now; }
}
let drag=null;
function ptr(e){
  const t=e.touches?e.touches[0]:e;
  const r=cv.getBoundingClientRect();
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function down(e){
  if(tut&&tut.on){
    const q=ptr(e), sc=cellCSS()/cell;
    if(TUT_SKIP && q.x>=TUT_SKIP.x*sc && q.x<=(TUT_SKIP.x+TUT_SKIP.w)*sc
       && q.y>=TUT_SKIP.y*sc && q.y<=(TUT_SKIP.y+TUT_SKIP.h)*sc){ endTut(); return; }
    if(tutKey()==='goal'){ tutAdvance('goal'); return; }
    if(tutKey()==='seal'&&tut.sealReady){ tutAdvance('seal'); return; }
  }
  if(tips.length) tips.forEach(t=>{ if(t.t>.35) t.t=.35; });
  if(!running||!piece) return;
  const p=ptr(e);
  /* pieces have .x, never .col — this recorded undefined, so every drag called
     moveTo(NaN). Math.max(0,Math.min(n,NaN)) is NaN, NaN>piece.x is false, and
     the piece walked left to the wall whichever way the finger went. */
  drag={x0:p.x,y0:p.y,col0:piece.x,moved:false,t0:performance.now()};
}
function movePtr(e){
  if(!drag||!running||!piece) return;
  const p=ptr(e), cw=cellCSS();
  const dx=p.x-drag.x0;
  if(Math.abs(dx)>cw*.45) drag.moved=true;
  if(drag.moved) moveTo(drag.col0+Math.round(dx/cw));
  if(drag.moved) e.preventDefault();
}
function up(e){
  if(!drag||!running||!piece){ drag=null; return; }
  const p=ptr(e.changedTouches?{touches:e.changedTouches}:e);
  const dy=p.y-drag.y0, dx=p.x-drag.x0, cw=cellCSS();
  if(!drag.moved){
    if(dy>34){ hardDrop(); }                          // flick down = drop
    else if(dy<-34){ rotate(); }                      // flick up = rotate
    else {                                            // tap a column = go there
      const c=Math.floor(p.x/cw)-Math.floor(piece.m[0].length/2);
      if(p.x < COLS*cw) moveTo(c);
    }
  } else if(dy>cw*2.6 && Math.abs(dx)<cw*1.2){
    hardDrop();
  }
  drag=null;
}
cv.addEventListener('touchstart',down,{passive:true});
cv.addEventListener('touchmove',movePtr,{passive:false});
cv.addEventListener('touchend',up,{passive:true});
cv.addEventListener('mousedown',down);
addEventListener('mousemove',movePtr);
addEventListener('mouseup',up);

/* ---- press-and-hold on the arrows ---- */
function holdable(el,fn){
  let t=null,iv=null;
  const start=e=>{ e.preventDefault(); fn();
    t=setTimeout(()=>{ iv=setInterval(fn,72); },260); };
  const stop=()=>{ clearTimeout(t); clearInterval(iv); t=iv=null; };
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('mousedown',start);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,stop));
}

score=0;spilled=0;spillDay=0;streak=0;dayStreak=0;used={};day=1;level=1;lake=78;batt=0;
regoDay=0;regoTotal=0;regos=[];
demand=makeDemand(1);
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
seedWeather(1); next=makePiece();
setLayout(); sizeCanvas(); updatePips(); renderShelf();
loadBest().then(intro);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(nw) nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage('skipWaiting');
      });
    });
    setInterval(()=>reg.update(), 60*60*1000);      // check hourly while open
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloaded) return; reloaded=true; location.reload();
  });
}
requestAnimationFrame(loop);
